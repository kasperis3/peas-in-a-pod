# Peas in a Pod — static web deploy (Expo export)
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm ci && npx expo export -p web"
  publish = "dist"

# EXPO_PUBLIC_* values are intentionally embedded in the client bundle.
# Netlify secrets scanning otherwise fails when it finds them in dist/*.js
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_DATA_SOURCE,EXPO_PUBLIC_SUPABASE_URL,EXPO_PUBLIC_SUPABASE_ANON_KEY"
